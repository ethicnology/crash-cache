services:
  postgres:
    profiles: [observability]
    image: docker.io/library/postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: crash_cache
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
      CRASH_CACHE_DB_PASSWORD: ${CRASH_CACHE_DB_PASSWORD:?Set CRASH_CACHE_DB_PASSWORD}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
      METABASE_READONLY_PASSWORD: ${METABASE_READONLY_PASSWORD:?Set METABASE_READONLY_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/10-observability.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d crash_cache"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    cpus: 1

  symbolicator:
    profiles: [observability]
    image: ghcr.io/getsentry/symbolicator:26.9.0
    restart: unless-stopped
    command: [run, --config, /etc/symbolicator/config.yml]
    depends_on:
      - symbols
    volumes:
      - ./symbolicator.yml:/etc/symbolicator/config.yml:ro
      - symbolicator_cache:/data
    mem_limit: 2g
    cpus: 2

  symbols:
    profiles: [observability]
    image: docker.io/library/python:3.14.7-slim-trixie
    restart: unless-stopped
    user: "65534:65534"
    command: [python3, -m, http.server, "8000", --bind, 0.0.0.0, --directory, /symbols]
    volumes:
      - ${SYMBOLS_DIRECTORY:?Set an absolute SYMBOLS_DIRECTORY}:/symbols:ro
    read_only: true
    mem_limit: 128m
    cpus: 0.5

  crash-cache:
    profiles: [observability]
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      symbolicator:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://crash_cache:${CRASH_CACHE_DB_PASSWORD}@postgres:5432/crash_cache
      DATABASE_POOL_SIZE: 5
      DATABASE_POOL_TIMEOUT_SECS: 10
      CRASH_CACHE_HOST: 0.0.0.0
      CRASH_CACHE_PORT: 3000
      MAX_COMPRESSED_PAYLOAD_BYTES: 16777216
      MAX_UNCOMPRESSED_PAYLOAD_BYTES: 33554432
      MAX_CONCURRENT_COMPRESSIONS: 2
      WORKER_INTERVAL_SECS: 2
      WORKER_REPORTS_BATCH_SIZE: 20
      RATE_LIMIT_REQUESTS_PER_SEC: 300
      RATE_LIMIT_PER_IP_PER_SEC: 20
      RATE_LIMIT_PER_PROJECT_PER_SEC: 100
      RATE_LIMIT_BURST_MULTIPLIER: 3
      ANALYTICS_FLUSH_INTERVAL_SECS: 60
      ANALYTICS_RETENTION_DAYS: 90
      ANALYTICS_BUFFER_SIZE: 10000
      METABASE_AUTH_URL: ${METABASE_AUTH_URL:-http://metabase:3000/api/user/current}
      SYMBOLICATOR_URL: http://symbolicator:3021
      SYMBOLICATOR_SOURCES_PATH: /etc/crash-cache/sources.json
    volumes:
      - ${SYMBOLICATOR_SOURCES_FILE:?Set an absolute SYMBOLICATOR_SOURCES_FILE}:/etc/crash-cache/sources.json:ro
    ports:
      - 127.0.0.1:${CRASH_CACHE_LAB_PORT:-3000}:3000
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: 1

  metabase:
    profiles: [dashboards]
    image: docker.io/metabase/metabase:v0.63.18.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: postgres
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3002}
      JAVA_TOOL_OPTIONS: -Xmx1024m
      MB_REPORT_TIMEZONE: UTC
      MB_ANON_TRACKING_ENABLED: "false"
    ports:
      - 127.0.0.1:${METABASE_LAB_PORT:-3001}:3000
    mem_limit: 2g
    cpus: 1

  dashboard-proxy:
    profiles: [dashboards]
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      metabase:
        condition: service_started
      crash-cache:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:${METABASE_PROXY_PORT:-3002}:8080
    read_only: true
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:
  symbolicator_cache:
